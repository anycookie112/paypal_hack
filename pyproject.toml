[project]
name = "paypal-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
